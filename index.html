<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>NodeLab</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
  <link rel="stylesheet" href="/css/app.css"/>
</head>
<body>
  <div class="landing" id="landing">
    <nav class="nav">
      <div class="logo"><span class="dot"></span> NodeLab</div>
      <button class="ghost" id="btnStart" type="button">시작하기</button>
    </nav>
    <div class="hero">
      <div class="eyebrow">수능 수학 자습</div>
      <h1>새벽에 문제집 풀다 막힐 때,<br/>과외쌤 부르듯 편하게.</h1>
      <p>사진 한 장 찍어 올리면, 틀린 부분만 콕 짚어줘요</p>
      <div>
        <button class="primary" id="btnStartHero" type="button">3초 만에 시작하기</button>
        <span class="hint">카드 등록 없이 · Free 10회</span>
      </div>
    </div>
  </div>

  <div class="app gone" id="app">
    <div class="top">
      <div class="logo"><span class="dot"></span> NodeLab</div>
      <div class="meta">
        <span class="badge off" id="phoneBadge">폰 대기</span>
        <button class="ghost" id="btnPair" type="button">폰으로 잇기</button>
        <button class="ghost" id="btnNext" type="button">다음 문제</button>
      </div>
    </div>
    <div class="stage">
      <section class="plate">
        <div class="kicker" id="kicker">문항</div>
        <div class="stem" id="stem"></div>
        <div class="opts" id="opts"></div>
      </section>
      <div class="chat" id="chat"></div>
      <div class="composer">
        <input id="ask" placeholder="이 문제에 대해서만 편하게 물어보세요" />
        <label class="ghost" style="display:grid;place-items:center">
          손풀이
          <input id="file" type="file" accept="image/*" hidden />
        </label>
      </div>
    </div>
  </div>

  <div class="modal gone" id="pairModal">
    <div class="modal-card">
      <h2>폰으로 잇기</h2>
      <p>같은 세션이 카메라 위에 떠요. QR을 스캔하거나 링크를 열면 됩니다.</p>
      <div id="qrBox"><canvas id="qr"></canvas></div>
      <div id="pairLink"></div>
      <div class="actions"><button class="primary" id="btnPairClose" type="button">닫기</button></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>

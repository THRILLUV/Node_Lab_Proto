<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NodeLab</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"/>
<style>
:root {
  --surface-primary:#f5f5f7; --surface-secondary:rgba(255,255,255,.62); --surface-elevated:rgba(255,255,255,.86); --surface-paper:#fff;
  --text-primary:#1d1d1f; --text-secondary:#6e6e73; --text-tertiary:#86868b;
  --border-default:rgba(29,29,31,.08); --border-subtle:rgba(29,29,31,.05);
  --accent-primary:#0071e3; --accent-tutor:#0f9d8a; --glow-orb:rgba(0,113,227,.14);
  --ok:#0f9d8a; --ng:#c93434;
  --ease:cubic-bezier(.32,.72,0,1);
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo",sans-serif;
  --display:"Plus Jakarta Sans","Pretendard Variable",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--text-primary);background:var(--surface-primary);letter-spacing:-.02em;overflow:hidden;min-block-size:100dvb}
body::before,body::after{content:"";position:fixed;pointer-events:none;z-index:0;border-radius:50%;filter:blur(80px)}
body::before{width:420px;height:420px;top:-80px;left:18%;background:var(--glow-orb)}
body::after{width:360px;height:360px;right:-40px;bottom:8%;background:rgba(15,157,138,.10)}
.app{position:relative;z-index:1;display:grid;grid-template-columns:280px minmax(0,1fr);gap:12px;padding:14px;height:100dvb}
.glass-shell{padding:6px;border-radius:28px;background:rgba(255,255,255,.28);border:1px solid var(--border-default);box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 18px 40px rgba(15,23,42,.05)}
.glass-core{height:100%;background:var(--surface-secondary);backdrop-filter:blur(28px) saturate(1.4);-webkit-backdrop-filter:blur(28px) saturate(1.4);border:1px solid rgba(255,255,255,.55);border-radius:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.sidebar-inner{display:flex;flex-direction:column;height:100%;padding:14px 12px 12px;min-height:0}
.brand{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 12px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:15px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent-tutor);box-shadow:0 0 10px rgba(15,157,138,.55)}
.icon-btn{width:32px;height:32px;border:0;border-radius:50%;background:rgba(255,255,255,.5);color:var(--text-secondary);cursor:pointer}
.new-session{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;cursor:pointer;background:var(--surface-elevated);border-radius:999px;padding:10px 12px 10px 14px;font:inherit;font-weight:600;font-size:13px;color:var(--text-primary);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 8px 20px rgba(15,23,42,.04);transition:transform 140ms var(--ease)}
.new-session:hover{background:#fff;transform:translateY(-1px)}
.kbd{font-size:10px;color:var(--text-tertiary)}
.menu{margin-top:14px;display:flex;flex-direction:column;gap:2px}
.item,.folder{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;color:var(--text-secondary);font-size:13px;cursor:pointer;border:0;background:transparent;width:100%;text-align:left;font:inherit}
.item:hover,.folder:hover{background:rgba(255,255,255,.55);color:var(--text-primary)}
.chev{width:14px;color:var(--text-tertiary);font-size:11px}
.folder-body{display:none;padding-bottom:4px}
.folder-body.open{display:block}
.scroll{flex:1;min-height:0;overflow:auto;margin-top:16px}
.overline{font-size:10px;font-weight:650;letter-spacing:.12em;text-transform:uppercase;color:var(--text-tertiary);padding:0 10px 8px}
.sub{padding:7px 10px 7px 34px;border-radius:10px;font-size:12.5px;color:var(--text-secondary);cursor:pointer;border:0;background:transparent;width:100%;text-align:left;font:inherit;display:block}
.sub:hover{background:rgba(255,255,255,.5);color:var(--text-primary)}
.sub.active{background:rgba(0,113,227,.10);color:var(--accent-primary);font-weight:600}
.foot{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 2px}
.avatar{width:28px;height:28px;border-radius:50%;background:#e8e8ed;display:grid;place-items:center;font-size:10px;font-weight:700}
.main{min-width:0;min-height:0}
.main-core{display:flex;flex-direction:column;min-height:0;overflow:hidden;height:100%}
.home{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px}
.home h1{font-size:34px;font-weight:600;letter-spacing:-.035em;margin-bottom:28px}
.composer-shell{width:min(680px,100%)}
.composer{background:var(--surface-elevated);border-radius:22px;padding:16px 16px 12px;border:1px solid var(--border-default);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 18px 40px rgba(15,23,42,.06)}
.composer textarea,.composer input{width:100%;border:0;outline:0;resize:none;background:transparent;font:inherit;font-size:16px;color:var(--text-primary)}
.composer textarea::placeholder,.composer input::placeholder{color:var(--text-tertiary)}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.left,.right{display:flex;align-items:center;gap:8px}
.round{width:34px;height:34px;border-radius:50%;border:0;cursor:pointer;background:rgba(29,29,31,.06);color:var(--text-primary);font-size:16px}
.send{background:#1d1d1f;color:#fff}
.chips{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;justify-content:center}
.chip{border:1px solid var(--border-default);background:rgba(255,255,255,.7);padding:8px 14px;border-radius:999px;font-size:13px;cursor:pointer;color:var(--text-secondary)}
.note{margin-top:28px;font-size:11px;color:var(--text-tertiary)}
.split{flex:1;min-height:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px}
.split.on{display:flex}
.home.off,.session.off{display:none}
.split-card{width:min(520px,100%);background:var(--surface-elevated);border:1px solid var(--border-default);border-radius:22px;padding:28px 28px 22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 18px 40px rgba(15,23,42,.06)}
.split-kicker{font-size:11px;font-weight:650;letter-spacing:.12em;text-transform:uppercase;color:var(--text-tertiary);margin-bottom:10px}
.split-card h2{font-size:22px;font-weight:650;letter-spacing:-.03em;margin-bottom:18px}
.split-log{display:flex;flex-direction:column;gap:8px;min-height:148px}
.split-line{font-size:14px;color:var(--text-secondary);padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.45)}
.split-line.on{color:var(--accent-primary);background:rgba(0,113,227,.08);font-weight:600}
.split-line.done{color:var(--accent-tutor)}
.split-line.finale{background:#1d1d1f;color:#fff;font-weight:700}
.session{flex:1;min-height:0;display:none;flex-direction:row}
.session.on{display:flex}
.col{flex:1;min-width:0;display:grid;grid-template-rows:auto auto 10px minmax(0,1fr) auto;min-height:0}
.tabs{display:flex;gap:6px;align-items:center;padding:10px 18px 0;overflow-x:auto;min-height:44px}
.page-note{flex:0 0 auto;border:1px solid rgba(15,157,138,.22);background:rgba(15,157,138,.10);color:var(--accent-tutor);border-radius:999px;padding:5px 10px;font-size:11.5px;font-weight:650;white-space:nowrap}
.ptab{border:1px solid var(--border-default);background:rgba(255,255,255,.55);color:var(--text-secondary);border-radius:999px;padding:5px 10px;font-size:11.5px;white-space:nowrap;cursor:pointer;font:inherit}
.ptab.on{background:#1d1d1f;color:#fff;border-color:#1d1d1f}
.ptab.page-end{margin-right:4px}
.plate{height:268px;min-height:188px;max-height:520px;margin:10px 16px 0;padding:12px 16px 10px;background:var(--surface-paper);border-radius:22px;border:1px solid var(--border-default);box-shadow:0 10px 30px rgba(15,23,42,.05);display:flex;flex-direction:column;min-height:0}
.plate-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.tags{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{background:var(--accent-primary);color:#fff;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px}
.concept{background:rgba(15,157,138,.10);color:var(--accent-tutor);font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px}
.hint{font-size:11px;color:var(--text-tertiary)}
.ghost{border:1px solid var(--border-default);background:rgba(245,245,247,.8);border-radius:999px;padding:7px 12px;font-size:12px;cursor:pointer;font:inherit}
.paper{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:16px;overflow:auto;padding:10px 16px}
.exam{width:100%;max-width:640px;font-size:15px;line-height:1.7;color:#1d1d1f}
.exam-no{font-weight:700;margin-right:6px}
.exam-stem{margin-bottom:10px}
.exam-opts{display:flex;flex-wrap:wrap;gap:10px 18px;font-size:14px}
.exam-pts{float:right;font-size:12px;color:var(--text-tertiary)}
.resizer{height:10px;cursor:row-resize;display:grid;place-items:center}
.knob{width:42px;height:3px;border-radius:99px;background:rgba(29,29,31,.18)}
.stream{min-height:0;overflow:auto;display:flex;justify-content:center;padding:8px 20px 12px}
.stream-w{width:min(720px,100%);display:flex;flex-direction:column;gap:16px}
.msg{display:flex;gap:12px}
.msg.me{flex-direction:row-reverse}
.ava{width:32px;height:32px;border-radius:50%;background:var(--accent-tutor);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;flex:0 0 auto}
.ava.user{background:#1d1d1f}
.bubble{flex:1;background:var(--surface-elevated);border:1px solid var(--border-default);border-radius:20px;padding:16px 18px;font-size:14px;line-height:1.55;box-shadow:inset 0 1px 0 rgba(255,255,255,.75)}
.msg.me .bubble{background:#1d1d1f;color:#fff;border-color:#1d1d1f;box-shadow:none;flex:0 1 auto;max-width:80%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.dec{text-align:left;border:1px solid var(--border-default);background:rgba(255,255,255,.8);border-radius:14px;padding:12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:transform 140ms var(--ease);display:flex;align-items:center;gap:8px;color:var(--text-primary)}
.dec:hover{border-color:rgba(0,113,227,.35);color:var(--accent-primary);transform:translateY(-1px)}
.dec.full{grid-column:span 2}
.n{width:18px;height:18px;border-radius:50%;background:#1d1d1f;color:#fff;display:inline-grid;place-items:center;font-size:10px;flex:0 0 18px}
.pad{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.pbtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--border-default);background:#fff;font:inherit;font-weight:700;cursor:pointer}
.pbtn:hover{border-color:rgba(0,113,227,.35);color:var(--accent-primary)}
.verdict{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:6px 10px;border-radius:999px;font-size:13px;font-weight:700}
.verdict.ok{background:rgba(15,157,138,.12);color:var(--ok)}
.verdict.ng{background:rgba(201,52,52,.10);color:var(--ng)}
.capture{margin-top:12px;border:1px dashed rgba(29,29,31,.22);border-radius:16px;padding:18px;text-align:center;background:rgba(255,255,255,.4)}
.capture b{display:block;margin-bottom:6px}
.ghost.solid{background:#1d1d1f;color:#fff;border-color:#1d1d1f}
.variant{margin-top:12px;padding:12px 14px;border-radius:14px;background:#fff;border:1px solid var(--border-default)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pin-note{min-height:56px;border:1px dashed var(--border-default);border-radius:16px;display:grid;place-items:center;color:var(--text-tertiary);font-size:13px;background:rgba(255,255,255,.35)}
.bottom{display:flex;justify-content:center;padding:0 20px 16px}
.bottom .composer{width:min(720px,100%);padding:10px 12px;border-radius:999px;display:flex;align-items:center;gap:8px}
.drawer{width:332px;flex:0 0 332px;display:flex;flex-direction:column;min-height:0;background:rgba(255,255,255,.42);border-left:1px solid var(--border-subtle)}
.drawer.off{width:0;flex-basis:0;opacity:0;pointer-events:none;overflow:hidden;border:0}
.dtabs{display:flex;align-items:stretch;border-bottom:1px solid var(--border-subtle)}
.dtab{flex:1;border:0;background:transparent;padding:13px 0;font:inherit;font-size:12.5px;font-weight:600;color:var(--text-secondary);cursor:pointer}
.dtab.on{color:var(--accent-primary);box-shadow:inset 0 -2px 0 var(--accent-primary)}
.qlist,.side{flex:1;min-height:0;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.qcard{background:rgba(255,255,255,.72);border:1px solid var(--border-default);border-radius:16px;padding:12px;cursor:pointer;text-align:left;font:inherit;width:100%}
.qcard.on{border-color:rgba(0,113,227,.35);background:rgba(0,113,227,.06)}
.qtop{display:flex;justify-content:space-between;font-size:11px;margin-bottom:6px;color:var(--text-tertiary)}
.mock{margin:0 14px 14px;border:0;width:calc(100% - 28px);border-radius:14px;padding:12px;background:var(--accent-tutor);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.sb{max-width:90%;padding:10px 12px;border-radius:14px;font-size:13px;line-height:1.45}
.sb.ai{background:rgba(255,255,255,.7);border:1px solid var(--border-default);align-self:flex-start}
.sb.user{background:#1d1d1f;color:#fff;align-self:flex-end}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="glass-shell">
    <div class="glass-core">
      <div class="sidebar-inner">
        <div class="brand">
          <div class="logo"><span class="dot"></span> NodeLab</div>
          <button class="icon-btn" aria-label="검색">⌕</button>
        </div>
        <button class="new-session" id="btn-new-session" type="button"><span>+ 새 자습 세션</span><span class="kbd">⌘N</span></button>
        <div class="menu">
          <button class="item" type="button">라이브러리</button>
          <button class="item" type="button">오답노트</button>
        </div>
        <div class="scroll">
          <div class="overline">고정됨</div>
          <button class="item" type="button" data-open-session="2026">2026 수능 수학 홀수형 · 공통+ 미적분</button>
          <button class="item" type="button" data-open-session="dokhak">독학사 1단계 수학</button>
          <div class="overline" style="margin-top:18px">프로젝트</div>

          <button class="folder" id="folder-suneung" type="button" aria-expanded="true">
            <span class="chev" id="chev-suneung">▾</span> 수능 수학 기출
          </button>
          <div class="folder-body open" id="body-suneung">
            <button class="sub" id="sess-2026" type="button" data-open-session="2026">2026 수능 수학 홀수형 · 공통+ 미적분 (30문항)</button>
            <button class="sub" id="sess-2025" type="button" data-open-session="2025">2025학년도 9월 모의평가</button>
          </div>

          <button class="folder" id="folder-transfer" type="button" aria-expanded="false" style="margin-top:8px">
            <span class="chev" id="chev-transfer">▸</span> 독학사·편입
          </button>
          <div class="folder-body" id="body-transfer">
            <button class="sub" id="sess-dokhak" type="button" data-open-session="dokhak">독학사 1단계 수학</button>
            <button class="sub" type="button" data-open-session="transfer">편입 미적분 워크북</button>
          </div>
        </div>
        <div class="foot">
          <div style="display:flex;align-items:center;gap:8px"><div class="avatar">TH</div><span style="font-size:13px;font-weight:600">THRILL UV</span></div>
          <span style="font-size:12px;color:var(--text-tertiary)">설정</span>
        </div>
      </div>
    </div>
  </aside>

  <main class="glass-shell main">
    <div class="glass-core main-core">
      <section class="home" id="homeScreen">
        <h1>무엇이든 편하게 시작해 보세요.</h1>
        <div class="composer-shell">
          <div class="composer">
            <textarea id="homeInput" rows="2" placeholder="수학 문제집 PDF를 올리거나, 모르는 문제를 물어보세요..."></textarea>
            <div class="row">
              <div class="left">
                <button class="round" id="btn-attach" type="button" aria-label="파일 첨부">+</button>
                <span style="font-size:13px;color:var(--text-secondary);cursor:pointer" id="lbl-attach">파일 첨부</span>
              </div>
              <div class="right">
                <button class="round" type="button" aria-label="음성">●</button>
                <button class="round send" id="btn-home-send" type="button">↑</button>
              </div>
            </div>
          </div>
          <div class="chips">
            <button class="chip" id="chip-upload" type="button">2026 수능 수학 PDF 업로드</button>
            <button class="chip" type="button" id="chip-drill">응용문제 집중 훈련</button>
          </div>
        </div>
        <p class="note">올린 원본은 이 세션 안에서만 쓰고, 공용 문제은행으로 재배포하지 않습니다.</p>
      </section>

      <section class="split" id="splitScreen">
        <div class="split-card">
          <div class="split-kicker">문항 분리</div>
          <h2 id="splitTitle">2026 수능 수학 PDF</h2>
          <div class="split-log" id="splitLog"></div>
        </div>
      </section>

      <section class="session" id="sessionScreen">
        <div class="col">
          <div class="tabs" id="tabBar"></div>
          <div class="plate" id="fixedProblemPanel">
            <div class="plate-head">
              <div class="tags" id="plateTags"></div>
              <button class="ghost" id="btn-drawer" type="button">문항 / 사이드 채팅</button>
            </div>
            <div class="paper" id="platePaper"></div>
          </div>
          <div class="resizer" id="dragResizer" title="드래그해서 문제창 높이 조절"><div class="knob"></div></div>
          <div class="stream" id="chatStream">
            <div class="stream-w" id="chatThread"></div>
          </div>
          <div class="bottom">
            <div class="composer">
              <input id="sessionInput" placeholder="이 문항만 질문하세요"/>
              <button class="round" type="button" aria-label="음성">●</button>
              <button class="round send" id="btn-session-send" type="button">↑</button>
            </div>
          </div>
        </div>
        <aside class="drawer" id="rightDrawer">
          <div class="dtabs">
            <button class="dtab on" id="btn-tab-qlist" type="button">문항 1–30</button>
            <button class="dtab" id="btn-tab-sidechat" type="button">사이드 채팅</button>
            <button class="dtab" style="flex:0 0 44px" id="btn-drawer-close" type="button">✕</button>
          </div>
          <div class="qlist" id="view-qlist"></div>
          <button class="mock" id="mockBtn" type="button">실전 모의고사 만들기</button>
          <div class="side" id="view-sidechat" style="display:none">
            <div class="sb ai">이 문항 맥락과 분리된 창입니다. 공식만 따로 물어보세요.</div>
            <div class="sb user">시그마 분배 법칙 3줄로.</div>
            <div class="sb ai">Σ(ca<sub>k</sub>+b<sub>k</sub>) = cΣa<sub>k</sub> + Σb<sub>k</sub>. 상수만 밖으로, 항은 항끼리.</div>
          </div>
        </aside>
      </section>
    </div>
  </main>
</div>
<script>

  const QUESTIONS = {

  function choiceVal(options, n) {
    return options[n - 1];
  }

  function clearSplitTimers() {
    state.splitTimers.forEach(clearTimeout);
    state.splitTimers = [];
  }

  function showView(view) {
    state.view = view;
    els.home.classList.toggle("off", view !== "home");
    els.split.classList.toggle("on", view === "split");
    els.session.classList.toggle("on", view === "session");
    if (view === "home") {
      document.querySelectorAll(".sub").forEach(function (el) { el.classList.remove("active"); });
    }
  }

  function resetItem() {
    state.phase = "prompt";
    state.pick = null;
    state.variantIndex = 0;
  }

  function setQuestion(n) {
    state.currentQ = n;
    resetItem();
    renderSession();
    const stream = document.getElementById("chatStream");
    if (stream) stream.scrollTop = 0;
  }

  function openSession(examKey, skipSplit) {
    state.exam = examKey;
    state.currentQ = 1;
    resetItem();
    document.querySelectorAll(".sub").forEach(function (el) {
      el.classList.toggle("active", el.getAttribute("data-open-session") === examKey);
    });
    if (examKey === "dokhak" || examKey === "transfer") {
      if (!state.folders.transfer) toggleFolder("transfer", true);
    } else if (!state.folders.suneung) {
      toggleFolder("suneung", true);
    }
    if (skipSplit) {
      showView("session");
      renderSession();
      return;
    }
    startSplit();
  }

  function startSplit() {
    clearSplitTimers();
    showView("split");
    els.splitTitle.textContent = EXAMS[state.exam].title;
    const hints = QUESTIONS.pageSplitHint;
    const p1 = hints[0];
    const p2 = hints[1];
    const p3 = hints[2];
    const line = function (page, items, cls) {
      return '<div class="split-line ' + cls + '">페이지 ' + page + " · " + items.length + "문항 (" + items[0] + "–" + items[items.length - 1] + "번)</div>";
    };
    const steps = [
      { t: 0, html: line(p1.page, p1.items, "on") },
      { t: 420, html: line(p1.page, p1.items, "done") + line(p2.page, p2.items, "on") },
      { t: 840, html: line(p1.page, p1.items, "done") + line(p2.page, p2.items, "done") + line(p3.page, p3.items, "on") },
      { t: 1260, html: line(p1.page, p1.items, "done") + line(p2.page, p2.items, "done") + line(p3.page, p3.items, "done") + '<div class="split-line on">페이지 4–16 · 공통+미적분</div>' },
      { t: 1600, html: line(p1.page, p1.items, "done") + line(p2.page, p2.items, "done") + line(p3.page, p3.items, "done") + '<div class="split-line done">페이지 4–16 · 공통+미적분</div><div class="split-line finale">30문항으로 분리</div>' }
    ];
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    els.splitLog.innerHTML = steps[0].html;
    if (reduce) {
      els.splitLog.innerHTML = steps[steps.length - 1].html;
      state.splitTimers.push(setTimeout(function () { showView("session"); renderSession(); }, 280));
      return;
    }
    steps.slice(1).forEach(function (step) {
      state.splitTimers.push(setTimeout(function () { els.splitLog.innerHTML = step.html; }, step.t));
    });
    state.splitTimers.push(setTimeout(function () { showView("session"); renderSession(); }, 1880));
  }

  function toggleFolder(key, forceOpen) {
    if (forceOpen === true) state.folders[key] = true;
    else state.folders[key] = !state.folders[key];
    const open = state.folders[key];
    document.getElementById("body-" + key).classList.toggle("open", open);
    document.getElementById("folder-" + key).setAttribute("aria-expanded", open ? "true" : "false");
    document.getElementById("chev-" + key).textContent = open ? "▾" : "▸";
  }

  function examPlate(q) {
    const opts = (q.options || []).map(function (opt, i) {
      return "<span>" + ["①", "②", "③", "④", "⑤"][i] + " " + opt + "</span>";
    }).join("");
    const kind = q.kind === "단답" ? '<div class="exam-opts">단답형</div>' : '<div class="exam-opts">' + opts + "</div>";
    return (
      '<div class="exam">' +
        '<div class="exam-pts">[' + q.points + "점]</div>" +
        '<div class="exam-stem"><span class="exam-no">' + q.n + ".</span> " + q.stem + "</div>" +
        kind +
      "</div>"
    );
  }

  function choiceGrid() {
    return (
      '<div class="grid">' +
        '<button class="dec" type="button" data-choice="1"><span class="n">1</span>빠른 채점</button>' +
        '<button class="dec" type="button" data-choice="2"><span class="n">2</span>개념 브리핑·확인</button>' +
        '<button class="dec" type="button" data-choice="3"><span class="n">3</span>손풀이 첨삭</button>' +
        '<button class="dec" type="button" data-choice="4"><span class="n">4</span>파생 응용문제</button>' +
        '<button class="dec full" type="button" data-choice="5"><span class="n">5</span>기타 직접 요청</button>' +
      "</div>"
    );
  }

  function promptBubble(q) {
    return (
      '<div class="msg"><div class="ava">AI</div><div class="bubble">' +
        q.n + "번부터 열었어요. 이 문항에서 어떻게 갈까요?" +
        choiceGrid() +
      "</div></div>"
    );
  }

  function userBubble(text) {
    return '<div class="msg me"><div class="ava user">나</div><div class="bubble">' + text + "</div></div>";
  }

  function aiBubble(html) {
    return '<div class="msg"><div class="ava">AI</div><div class="bubble">' + html + "</div></div>";
  }

  function numberPad(prefix) {
    return (
      '<div class="pad">' +
        [1, 2, 3, 4, 5].map(function (n) {
          return '<button class="pbtn" type="button" data-pad="' + prefix + '" data-n="' + n + '">' + n + "</button>";
        }).join("") +
      "</div>"
    );
  }

  function shortBox(which) {
    return '<div class="actions"><input class="short-ans" id="short-' + which + '" placeholder="답을 입력" style="flex:1;min-width:140px;border:1px solid var(--border-default);border-radius:12px;padding:8px 10px;font:inherit"/><button class="ghost solid" type="button" data-action="submit-' + which + '">입력</button></div>';
  }

  function gradePrompt(q) {
    if (q.kind === "단답") {
      return "단답입니다. 답을 입력하면 정오만 알려드릴게요. 입력 전에는 정답을 말하지 않습니다." + shortBox("grade");
    }
    return "보기 번호를 눌러 주세요. 정오만 바로 알려드릴게요." + numberPad("grade");
  }

  function appPrompt(v) {
    const body = '<div class="variant"><b>' + (v.id || "변형") + "</b><div style=\"margin-top:6px\">" + v.stem + "</div>" +
      (v.options.length
        ? '<div class="exam-opts" style="margin-top:8px">' + v.options.map(function (opt, i) {
            return "<span>" + ["①", "②", "③", "④", "⑤"][i] + " " + opt + "</span>";
          }).join("") + "</div>"
        : "<div class=\"hint\" style=\"margin-top:8px\">단답 · 답을 먼저 쓰기 전에는 해설 없음</div>") +
      "</div>";
    const input = v.options.length ? numberPad("app") : shortBox("app");
    return "같은 유형, 숫자만 바꾼 변형입니다. 풀기 전에는 해설을 열지 않아요." + body + input +
      '<div class="actions"><button class="ghost" type="button" id="btn-redraw" data-action="redraw">다시 내기</button></div>';
  }

  function verdict(ok) {
    return ok
      ? '<div class="verdict ok">정답 · 맞았습니다</div>'
      : '<div class="verdict ng">오답 · 다시 보면 좋아요</div>';
  }

  function againChoices() {
    return '<div class="actions"><button class="ghost" type="button" data-action="again">다른 방식으로</button></div>';
  }

  function gradeOk(expected, got) {
    return normAns(expected) === normAns(got);
  }

  function renderChat() {
    const q = question(state.currentQ);
    const p = state.phase;
    let html = promptBubble(q);

    if (p === "prompt") {
      html += '<div class="pin-note">채팅을 내려도 위 문제는 그대로 고정됩니다.</div>';
    }

    if (p === "grade" || p === "gradeResult") {
      html += userBubble("1 빠른 채점");
      html += aiBubble(gradePrompt(q));
      if (p === "gradeResult") {
        const ok = gradeOk(q.answer, state.pick);
        html += userBubble(escapeHtml(String(state.pick)));
        html += aiBubble((ok ? "정답입니다." : "오답입니다.") + verdict(ok) + againChoices());
      }
    }

    if (p === "concept" || p === "conceptOk" || p === "conceptFollow" || p === "conceptBack") {
      html += userBubble("2 개념 브리핑·확인");
      html += aiBubble(
        "<b>개념 브리핑</b><br/>" + q.briefing +
        "<br/><br/><b>확인 질문</b><br/>이 유형에서 가장 먼저 쓸 식만 떠올려 보세요. 막히면 보기 1을 정답으로 가정한 확인입니다." +
        numberPad("check")
      );
      if (p === "conceptOk" || p === "conceptFollow" || p === "conceptBack") {
        html += userBubble(state.pick + "번");
        if (Number(state.pick) === 1) {
          html += aiBubble("맞아요. 이 칸은 잡혔습니다. 원문항으로 바로 돌아갈게요." + verdict(true) + againChoices());
        }
      }
      if (p === "conceptFollow" || p === "conceptBack") {
        html += aiBubble(q.check.follow + "<br/><button class=\"ghost solid\" type=\"button\" data-action=\"back-item\" style=\"margin-top:12px\">원문항으로 돌아가기</button>");
      }
      if (p === "conceptBack") {
        html += aiBubble(q.n + "번 원문항으로 돌아왔어요. 진단 화면은 열지 않습니다. 이제 어떻게 할까요?" + choiceGrid());
      }
    }

    if (p === "hand" || p === "handDone") {
      html += userBubble("3 손풀이 첨삭");
      html += aiBubble(
        "이 문항 화면을 유지한 채 손풀이만 찍어 주세요. 새 홈으로 나가지 않습니다." +
        '<div class="capture"><b>손풀이 캡처</b><span style="font-size:12px;color:var(--text-tertiary)">책상 위 풀이를 이 문항 위에 올리는 척합니다.</span><div class="actions" style="justify-content:center"><button class="ghost solid" type="button" data-action="capture">촬영하기</button></div></div>'
      );
      if (p === "handDone") {
        html += userBubble("손풀이를 올렸어요");
        html += aiBubble("한 줄만 다시 보면 됩니다. 이 문항 탭에 그대로 있을게요. 정답은 아직 풀지 않았습니다." + againChoices());
      }
    }

    if (p === "app" || p === "appResult") {
      const v = q.variants[state.variantIndex % q.variants.length];
      html += userBubble("4 파생 응용문제");
      html += aiBubble(appPrompt(v));
      if (p === "appResult") {
        const ok = gradeOk(v.answer, state.pick);
        html += userBubble(escapeHtml(String(state.pick)));
        html += aiBubble((ok ? "맞았습니다. 유형이 잡힌 느낌이에요." : "오답입니다.") + verdict(ok) +
          '<div class="actions"><button class="ghost" type="button" data-action="redraw">다시 내기</button></div>');
      }
    }

    if (p === "other" || p === "otherReply") {
      html += userBubble("5 기타 직접 요청");
      html += aiBubble("이 문항만, 하고 싶은 말을 아래 칸에 적어 주세요. 짧게 받아칠게요.");
      if (p === "otherReply") {
        html += userBubble(escapeHtml(state.pick || ""));
        html += aiBubble("이 문항 범위에서만 답할게요. 힌트: 위 고정 문제의 조건을 한 줄로 다시 써 보면 길이 보여요. 정답은 먼저 말하지 않을게요." + againChoices());
      }
    }

    els.chatThread.innerHTML = html;
  }

  function renderSession() {
    const q = question(state.currentQ);
    const exam = EXAMS[state.exam];
    const page = pageOf(state.currentQ);

    let tabs = '<span class="page-note" id="pageNote">p.' + page.page + " · " + page.from + "–" + page.to + "번</span>";
    for (let n = 1; n <= 30; n++) {
      const end = QUESTIONS.pageSplitHint.some(function (h) {
        return h.items[h.items.length - 1] === n && n < 30;
      });
      tabs += '<button class="ptab' + (n === state.currentQ ? " on" : "") + (end ? " page-end" : "") +
        '" type="button" data-q="' + n + '" id="tab-' + n + '">' + n + "번</button>";
    }
    els.tabBar.innerHTML = tabs;

    els.plateTags.innerHTML =
      '<span class="badge">' + exam.badge + " " + q.n + "번 · " + q.points + "점</span>" +
      '<span class="concept">' + q.concept + "</span>" +
      '<span class="hint">아래 선을 드래그해서 문제 크기를 맞추세요</span>';
    els.platePaper.innerHTML = examPlate(q);

    renderChat();

    let cards = "";
    for (let n = 1; n <= 30; n++) {
      const qq = question(n);
      const st = n === state.currentQ ? "학습 중" : "대기";
      cards += '<button class="qcard' + (n === state.currentQ ? " on" : "") + '" type="button" data-q="' + n + '">' +
        '<div class="qtop"><span>' + n + "번</span><span" + (n === state.currentQ ? ' style="color:var(--accent-primary)"' : "") + ">" + st + "</span></div>" +
        "<b>" + qq.title + (n >= 23 ? " · 미적분" : "") + "</b></button>";
    }
    els.qlist.innerHTML = cards;
    els.drawer.classList.toggle("off", !state.drawerOpen);
    document.querySelectorAll(".sub").forEach(function (el) {
      el.classList.toggle("active", el.getAttribute("data-open-session") === state.exam);
    });
  }

  function choose(id) {
    if (id === 1) { state.phase = "grade"; state.pick = null; }
    if (id === 2) { state.phase = "concept"; state.pick = null; }
    if (id === 3) { state.phase = "hand"; state.pick = null; }
    if (id === 4) { state.phase = "app"; state.pick = null; state.variantIndex = 0; }
    if (id === 5) {
      state.phase = "other";
      state.pick = null;
      renderChat();
      els.sessionInput.focus();
      return;
    }
    renderChat();
  }

  function onPad(kind, n) {
    const q = question(state.currentQ);
    if (kind === "grade") {
      state.pick = q.options.length ? choiceVal(q.options, n) : String(n);
      state.phase = "gradeResult";
    }
    if (kind === "check") {
      state.pick = n;
      state.phase = (n === 1) ? "conceptOk" : "conceptFollow";
    }
    if (kind === "app") {
      const v = q.variants[state.variantIndex % q.variants.length];
      state.pick = v.options.length ? choiceVal(v.options, n) : String(n);
      state.phase = "appResult";
    }
    renderChat();
  }

  function submitTyped(which) {
    const box = document.getElementById("short-" + which);
    const text = box ? box.value.trim() : els.sessionInput.value.trim();
    if (!text) return;
    state.pick = text;
    if (which === "grade") state.phase = "gradeResult";
    if (which === "app") state.phase = "appResult";
    renderChat();
  }

  document.getElementById("btn-new-session").addEventListener("click", function () {
    clearSplitTimers();
    resetItem();
    showView("home");
  });
  document.getElementById("folder-suneung").addEventListener("click", function () { toggleFolder("suneung"); });
  document.getElementById("folder-transfer").addEventListener("click", function () { toggleFolder("transfer"); });
  document.getElementById("chip-upload").addEventListener("click", function () { openSession("2026", false); });
  document.getElementById("chip-drill").addEventListener("click", function () { openSession("2026", false); });
  document.getElementById("btn-attach").addEventListener("click", function () { openSession("2026", false); });
  document.getElementById("lbl-attach").addEventListener("click", function () { openSession("2026", false); });
  document.getElementById("btn-home-send").addEventListener("click", function () { openSession("2026", false); });
  document.querySelectorAll("[data-open-session]").forEach(function (el) {
    el.addEventListener("click", function () {
      openSession(el.getAttribute("data-open-session"), true);
    });
  });

  document.getElementById("btn-drawer").addEventListener("click", function () {
    state.drawerOpen = !state.drawerOpen;
    els.drawer.classList.toggle("off", !state.drawerOpen);
  });
  document.getElementById("btn-drawer-close").addEventListener("click", function () {
    state.drawerOpen = false;
    els.drawer.classList.add("off");
  });
  document.getElementById("btn-tab-qlist").addEventListener("click", function () {
    state.drawerTab = "qlist";
    document.getElementById("btn-tab-qlist").classList.add("on");
    document.getElementById("btn-tab-sidechat").classList.remove("on");
    document.getElementById("view-qlist").style.display = "flex";
    document.getElementById("mockBtn").style.display = "block";
    document.getElementById("view-sidechat").style.display = "none";
  });
  document.getElementById("btn-tab-sidechat").addEventListener("click", function () {
    state.drawerTab = "side";
    document.getElementById("btn-tab-qlist").classList.remove("on");
    document.getElementById("btn-tab-sidechat").classList.add("on");
    document.getElementById("view-qlist").style.display = "none";
    document.getElementById("mockBtn").style.display = "none";
    document.getElementById("view-sidechat").style.display = "flex";
  });

  document.getElementById("tabBar").addEventListener("click", function (e) {
    const btn = e.target.closest("[data-q]");
    if (btn) setQuestion(Number(btn.getAttribute("data-q")));
  });
  document.getElementById("view-qlist").addEventListener("click", function (e) {
    const btn = e.target.closest("[data-q]");
    if (btn) setQuestion(Number(btn.getAttribute("data-q")));
  });

  document.getElementById("chatThread").addEventListener("click", function (e) {
    const choice = e.target.closest("[data-choice]");
    if (choice) {
      choose(Number(choice.getAttribute("data-choice")));
      return;
    }
    const pad = e.target.closest("[data-pad]");
    if (pad) {
      onPad(pad.getAttribute("data-pad"), Number(pad.getAttribute("data-n")));
      return;
    }
    const act = e.target.closest("[data-action]");
    if (!act) return;
    const action = act.getAttribute("data-action");
    if (action === "capture") { state.phase = "handDone"; renderChat(); }
    if (action === "redraw") {
      state.variantIndex = (state.variantIndex + 1) % 3;
      state.phase = "app";
      state.pick = null;
      renderChat();
    }
    if (action === "back-item") { state.phase = "conceptBack"; renderChat(); }
    if (action === "again") { resetItem(); renderChat(); }
    if (action === "submit-grade") submitTyped("grade");
    if (action === "submit-app") submitTyped("app");
  });

  document.getElementById("chatThread").addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    if (e.target && e.target.id === "short-grade") { e.preventDefault(); submitTyped("grade"); }
    if (e.target && e.target.id === "short-app") { e.preventDefault(); submitTyped("app"); }
  });

  function sendOther() {
    const text = els.sessionInput.value.trim();
    if (!text) return;
    if (state.phase === "grade" && question(state.currentQ).kind === "단답") {
      state.pick = text; state.phase = "gradeResult"; els.sessionInput.value = ""; renderChat(); return;
    }
    if (state.phase === "app") {
      const v = question(state.currentQ).variants[state.variantIndex % 3];
      if (!v.options.length) {
        state.pick = text; state.phase = "appResult"; els.sessionInput.value = ""; renderChat(); return;
      }
    }
    if (state.phase === "other" || state.phase === "otherReply" || state.phase === "prompt") {
      if (state.phase === "prompt") state.phase = "other";
      state.pick = text;
      state.phase = "otherReply";
      els.sessionInput.value = "";
      renderChat();
    }
  }
  document.getElementById("btn-session-send").addEventListener("click", sendOther);
  els.sessionInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); sendOther(); }
  });

  document.addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "n") {
      e.preventDefault();
      clearSplitTimers();
      resetItem();
      showView("home");
    }
  });

  const resizer = document.getElementById("dragResizer");
  const panel = document.getElementById("fixedProblemPanel");
  let dragging = false, startY = 0, startH = 0;
  resizer.addEventListener("mousedown", function (e) {
    dragging = true; startY = e.clientY; startH = panel.offsetHeight; e.preventDefault();
  });
  window.addEventListener("mousemove", function (e) {
    if (!dragging) return;
    panel.style.height = Math.min(520, Math.max(168, startH + e.clientY - startY)) + "px";
  });
  window.addEventListener("mouseup", function () { dragging = false; });
  resizer.addEventListener("dblclick", function () { panel.style.height = "268px"; });

  showView("home");
})();
</script>

</body>
</html>
